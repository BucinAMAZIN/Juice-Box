name: Picks and site

on:
  push:
    branches: [main]
  schedule:
    # GitHub drops or delays jobs scheduled on the hour, so these use odd minutes and each job has a backup.
    # Every task is safe to repeat: picks are append-only and grading skips anything already graded.
    # Picks: 13:47 and 14:37 UTC (about 9am Eastern, before Sunday NFL kickoffs), 18:43 UTC for later slates.
    - cron: "47 13 * * *"
    - cron: "37 14 * * *"
    - cron: "43 18 * * *"
    # Grades: 08:17 UTC (about 3am Eastern in winter) with backups at 09:11 and 10:29.
    - cron: "17 8 * * *"
    - cron: "11 9 * * *"
    - cron: "29 10 * * *"
    # Grade as games finish: about every 25 minutes from 1pm to midnight Eastern, when anything is playing.
    - cron: "7,32,57 17-23 * * *"
    - cron: "7,32,57 0-4 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        default: picks
        options:
          - picks
          - grade
          - backfill
          - lines-backfill
          - lines-extras
          - none
      league:
        description: "League for lines-backfill (nba, nfl, nhl, ncaaf, ncaab, mlb)"
        type: string
        default: nba

permissions:
  contents: write
  pages: write
  id-token: write

# Never cancel a run midway: it may be in the middle of committing data.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Decide what to run
        id: task
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TASK: ${{ inputs.task }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHEDULE" = "47 13 * * *" ] || [ "$SCHEDULE" = "37 14 * * *" ] || [ "$SCHEDULE" = "43 18 * * *" ]; then echo "task=picks" >> "$GITHUB_OUTPUT"; else echo "task=grade" >> "$GITHUB_OUTPUT"; fi
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "task=$INPUT_TASK" >> "$GITHUB_OUTPUT"
          else
            echo "task=dry" >> "$GITHUB_OUTPUT"
          fi

      - run: npm test

      - name: List today's streaks
        if: steps.task.outputs.task == 'picks'
        run: npm run streaks

      # Average minutes per game for the Playing time filter. Not critical, so a failure never stops the run.
      - name: NBA minutes
        if: steps.task.outputs.task == 'picks' || steps.task.outputs.task == 'grade'
        continue-on-error: true
        run: npm run minutes

      - name: Grade streaks
        if: steps.task.outputs.task == 'grade'
        run: npm run grade-streaks

      # College football favorites of 20+: track the new ones and grade the finished ones. Failure here never blocks the streaks.
      - name: Track college blowouts
        if: steps.task.outputs.task == 'picks' || steps.task.outputs.task == 'grade'
        continue-on-error: true
        run: npm run blowouts

      # Every game in every league with a line: spread and total now, the final score later.
      - name: Track lines
        if: steps.task.outputs.task == 'picks' || steps.task.outputs.task == 'grade'
        continue-on-error: true
        run: npm run lines

      # Linemate's team trends (spreads, team totals, moneylines): save today's and grade finished games.
      - name: Team trends
        if: steps.task.outputs.task == 'picks' || steps.task.outputs.task == 'grade'
        continue-on-error: true
        run: npm run team-trends

      # A lean is logged once, before kickoff, and graded after the final.
      - name: Log leans
        if: steps.task.outputs.task == 'picks' || steps.task.outputs.task == 'grade'
        continue-on-error: true
        run: npm run leans

      - name: Opening totals and prices for line history
        if: steps.task.outputs.task == 'lines-extras'
        env:
          LEAGUE: ${{ inputs.league }}
        run: npm run lines -- --extras --league="$LEAGUE"

      - name: Backfill line history
        if: steps.task.outputs.task == 'lines-backfill'
        env:
          LEAGUE: ${{ inputs.league }}
        run: npm run lines -- --backfill --league="$LEAGUE"

      - name: Backfill college blowout history
        if: steps.task.outputs.task == 'backfill'
        run: npm run blowouts -- --backfill

      # On a normal push, rehearse the real run without writing anything, so the log shows
      # whether the NHL feeds are reachable and what the engine would pick.
      - name: Dry run
        if: steps.task.outputs.task == 'dry'
        continue-on-error: true
        run: |
          npm run streaks -- --dry-run
          npm run grade-streaks -- --dry-run
          npm run blowouts -- --dry-run
          npm run lines -- --dry-run
          npm run leans -- --dry-run
          npm run team-trends -- --dry-run

      - name: Commit data
        if: steps.task.outputs.task == 'picks' || steps.task.outputs.task == 'grade' || steps.task.outputs.task == 'backfill' || steps.task.outputs.task == 'lines-backfill' || steps.task.outputs.task == 'lines-extras'
        env:
          TASK: ${{ steps.task.outputs.task }}
        run: |
          git config user.name "juice-box-bot"
          git config user.email "juice-box-bot@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: $TASK $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - run: npm run build
        env:
          VITE_BASE: /Juice-Box/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
