name: Probe ESPN NHL
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://site.api.espn.com/apis/site/v2/sports/hockey/nhl
          curl -s "$B/scoreboard?dates=20261122" > sb.json
          python3 - <<'PY'
          import json
          d=json.load(open('sb.json'))
          for e in d['events']:
              c=e['competitions'][0]
              print('EVENT',e['id'],[ (x['homeAway'],x['team']['abbreviation'],x.get('score')) for x in c['competitors']], c['status']['type']['state'], c['status'].get('displayClock'), c['status'].get('period'))
          PY
          id=$(python3 -c "import json;print(json.load(open('sb.json'))['events'][0]['id'])")
          curl -s "$B/summary?event=$id" > sm.json
          python3 - <<'PY'
          import json
          j=json.load(open('sm.json'))
          for t in j['boxscore']['players']:
              print('TEAM',t['team']['abbreviation'])
              for s in t['statistics']:
                  print(' group',s.get('name'),s.get('keys'),[ (a['athlete']['displayName'],a['stats']) for a in s['athletes'][:2]])
          PY
